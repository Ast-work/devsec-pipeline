name: Deploy Dev

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "SHA-256 digest of the container image to deploy"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull container image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/devsecops-demo:${{ github.sha }}
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker pull "$IMAGE@${{ inputs.image_digest }}"
      - name: Run container
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/devsecops-demo:${{ github.sha }}
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker run --rm "$IMAGE" date
